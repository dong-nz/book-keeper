# NFR-10 (SPEC-v0.0.11 §3.4, as modified by DR-390): the CI verification
# pipeline. Every push and every pull request runs the verification layers on
# the three-OS matrix; any red layer is a red pipeline (AC-157). The UI lane
# runner is not a CI layer — the user's decision of 2026-11-18 (DR-390); the
# real-app layer stays the local Phase-A/C entry point (scripts/ui-verify.mjs,
# unchanged). Per-job and combined wall times are reported in the run summary
# (AC-158, D29's data source).
name: CI

on:
  push:
    branches: ["master"] # tag pushes belong to release.yml; a pre-flight tag must not run CI (DR-382)
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false # every layer reports its own verdict; one red OS does not hide the others
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Wall clock — start (AC-158)
        id: clock
        run: echo "start=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Install Linux build dependencies (Tauri)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Set up Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache the cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      - name: Fetch the Pdfium library (DR-50c — src-tauri/binaries is generated, never committed)
        run: node scripts/fetch-pdfium.mjs

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      # The layers of AC-157, in the order RULES workflow 3 builds them.
      - name: Rust tests — cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Rust lint — cargo clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Frontend unit tests — vitest
        working-directory: ui
        run: pnpm test

      - name: Frontend types — svelte-check
        working-directory: ui
        run: pnpm run check

      - name: Wall clock — job summary (AC-158)
        if: always()
        run: |
          wall=$(( $(date +%s) - ${{ steps.clock.outputs.start }} ))
          echo "## Job wall time — ${{ matrix.os }}" >>"$GITHUB_STEP_SUMMARY"
          echo "- Job: ${{ github.job }} (${{ matrix.os }})" >>"$GITHUB_STEP_SUMMARY"
          echo "- Wall: ${wall} s" >>"$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >>"$GITHUB_STEP_SUMMARY"

  # The combined view (AC-158): every job's wall time and the run's combined
  # span, read from the run's own job records. Runs even when a job is red —
  # the measurement is D29's data source regardless of the verdict.
  summary:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Combined wall-time report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate \
            | python3 scripts/ci-summary.py >>"$GITHUB_STEP_SUMMARY"
