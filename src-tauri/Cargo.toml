[package]
name = "pdfkeeper"
version = "0.0.10"
edition = "2024"

[dependencies]
lopdf = "0.47.0"
# DR-53: `image` is already in the tree via pdfium-render (jpeg-only features);
# declaring it with `png` enables the PNG encoding the cover cache writes.
image = { version = "0.25", default-features = false, features = ["png"] }
pdfium-render = "0.9.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# DR-294 (OQ-53 A): EPUB parsing. `zip` with only the deflate backend — the
# flate2 already in the tree via lopdf/png (M14); no new codec crates, no C
# build deps. `quick-xml` is the version the lockfile already resolves.
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
# DR-321 (OQ option A) + DR-329: app updates for FR-25 — the official updater
# plugin, pinned to the 2.14.1 release the `@2` constraint resolves on the
# tauri 2.12.5 line. Its transitive tree (reqwest, tauri-plugin-fs,
# minisign-verify, tempfile) belongs to the plugin, not to this manifest.
tauri-plugin-updater = "2.14.1"
# DR-330: `tauri::generate_context!` deserializes the `plugins` config section
# through `serde_json` by name — with `plugins.updater` present the app crate
# must declare it (the standard Tauri template ships the same line). Zero new
# crates in the graph: 1.0.154 is what tauri already resolves.
serde_json = "1.0.154"
thiserror = "2.0.21"
# DR-352 (user's answer A): the `log` facade bridge for the updater plugin's
# own error records (the only signal for update-check failures). 0.4.35 is
# what tauri already resolves — zero new crates in the graph.
log = "0.4"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
